name: Automatic NIOS Notification Scraper

on:
  schedule:
    # Runs every 6 hours corresponding to IST:
    # 00:30 UTC = 06:00 AM IST
    # 06:30 UTC = 12:00 PM IST
    # 12:30 UTC = 06:00 PM IST
    # 18:30 UTC = 12:00 AM IST
    - cron: '30 0,6,12,18 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute NIOS notification scraper
        run: node scripts/scrape-nios.js

      - name: Commit and push changes if updated
        run: |
          if ! git diff --quiet content/nios-notification.json; then
            echo "Changes detected in content/nios-notification.json. Committing..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add content/nios-notification.json
            git commit -m "chore(notifications): auto-update NIOS notification [skip ci]"
            git push
          else
            echo "No notification changes detected. Skipping commit."
          fi
